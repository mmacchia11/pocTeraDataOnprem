[project]
name = "poc-teradata-onprem"
version = "0.1.0"
description = "Teradata on-premise simulation using Docker"
authors = [
    {name = "Martin", email = "martin@example.com"},
]
dependencies = [
    "teradatasql>=17.20.0.28",
    "pytest>=7.4.0",
    "requests>=2.31.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pylint>=3.0.0",
    "mypy>=1.5.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "ruff>=0.1.0",
    "pylint>=3.0.0",
    "mypy>=1.5.0",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "A", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pylint.messages_control]
disable = ["C0114", "C0116", "R0903"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true